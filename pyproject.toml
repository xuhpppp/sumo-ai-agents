[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sumo-agents"
version = "0.1.0"
description = "SUMO multi-agent traffic control — POC"
requires-python = ">=3.14"
# Real dependencies live in requirements.txt (fully pinned) — this file only
# handles packaging so `import sumo_agents` works from the src/ layout.
dynamic = []

[tool.setuptools.packages.find]
where = ["src"]
