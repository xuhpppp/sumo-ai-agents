services:
  # Only the `db` service exists at this step (STEPS.md Step 4). `sim` and
  # `app` are added in later phases (see IMPLEMENTATION_PLAN.md section 10).
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sumo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required -- copy .env.example to .env and set it}
    ports:
      # Published to the host so Alembic/pytest/dev scripts running directly
      # on the host's .venv (Phase 0-2, before `sim`/`app` are containerized)
      # can reach Postgres at localhost:5432. Fine to remove once `sim`/`app`
      # join this compose file and talk to `db` over the internal network.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
